<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be Smart Fitness Club | Gym Management System</title>
    <script>
      // GitHub Pages has no rewrite rules, so a refresh on a client-side route
      // such as /gym-be-smart/members is answered with this file. Park the path
      // the visitor asked for, then hand over to index.html; main.jsx puts it
      // back into the address bar before React Router reads it.
      (function () {
        var BASE = '/gym-be-smart/';
        var location = window.location;
        var path = location.pathname + location.search + location.hash;
        try {
          if (path !== BASE && path !== BASE.slice(0, -1)) {
            sessionStorage.setItem('besmart.deeplink', path);
          }
        } catch (error) {
          /* sessionStorage unavailable, the app still loads at the base path. */
        }
        location.replace(location.origin + BASE);
      })();
    </script>
  </head>
  <body></body>
</html>
